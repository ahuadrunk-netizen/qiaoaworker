# 方案 1：LoRA — LLM only（视觉塔全冻结）
# OmniGuard-68 计数，问答与船艇 SFT 相同：英文问题 + 百分比 <|ref|>/<|box|>
model_name_or_path: "/workspace/zzy/modelscope/Qwen3.8-27B"
base_model_path: "/workspace/zzy/modelscope/Qwen3.8-27B"
freeze_vision_tower: false
torch_dtype: "bfloat16"

lora:
  enabled: true
  r: 64
  alpha: 128
  dropout: 0.05
  llm_attn: true
  llm_mlp: true
  lm_head: true
  merger: false
  vision_last_n: 0

datasets:
  - path: "/workspace/zzy/python/model_train/Qwen3.8/TVP/data/jsonl/train.jsonl"
    image_root: "/data/wchen/data/OmniGuard-68"
    task_type: "counting"
    weight: 1.0

total_samples: 180433
batch_size: 1
gradient_accumulation_steps: 16
epochs: 1
learning_rate: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.03
grad_clip: 1.0
max_length: 8192
image_size: 1024
image_min_pixels: 12544
image_max_pixels: 2007040
tile:
  enabled: false
num_workers: 0
log_steps: 10
save_steps: 0
save_optim_steps: 200
keep_checkpoints: 4
zero_stage: 3
offload_optimizer: "cpu"
